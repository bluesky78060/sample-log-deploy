<!DOCTYPE html>
<html lang="ko" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>시료 접수 대장</title>
    <!-- 폰트 preconnect 및 preload로 성능 최적화 (bundle-defer-third-party) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="shared/tailwind-output.css">
    <link rel="stylesheet" href="index-styles.css">
</head>

<body>
    <!-- 부유하는 파티클 -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- 통합 상단 바 -->
    <div class="top-bar">
        <div class="top-bar-right">
            <button class="sync-btn" id="syncBtn">
                <svg class="sync-btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
                <span class="sync-btn-label">동기화</span>
            </button>
            <a href="settings/index.html" class="top-bar-icon-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                <span class="btn-tooltip">설정</span>
            </a>
            <a href="release/index.html" class="top-bar-icon-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/></svg>
                <span class="btn-tooltip">릴리즈 노트</span>
            </a>
            <a href="manual/index.html" class="top-bar-icon-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                <span class="btn-tooltip">설명서</span>
            </a>
            <div class="theme-toggle-wrapper">
                <svg class="theme-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                <button class="theme-toggle-btn" id="themeToggleBtn" title="다크 모드 전환"></button>
                <svg class="theme-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
            </div>
        </div>
    </div>

    <!-- 동기화 결과 모달 -->
    <div class="sync-modal" id="syncModal">
        <div class="sync-modal-content">
            <div class="sync-modal-header">
                <div class="sync-modal-title">
                    <span>☁️</span>
                    <span>동기화 결과</span>
                </div>
                <button class="sync-modal-close" id="syncModalClose">&times;</button>
            </div>
            <div class="sync-modal-body" id="syncModalBody">
                <!-- 동기화 결과가 여기에 표시됩니다 -->
            </div>
            <div class="sync-modal-footer">
                <button class="sync-modal-btn" id="syncModalOk">확인</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>시료 접수 대장</h1>
            <p>분석할 시료 종류를 선택해주세요</p>
        </div>

        <div class="sample-types">
            <!-- 토양 -->
            <a href="soil/index.html" class="sample-type-card soil">
                <img class="card-icon" src="assets/icons/soil.svg" alt="토양">
                <div class="card-title">토양</div>
                <div class="card-description">논, 밭, 과수, 시설 토양 분석</div>
                <span class="card-status active">● 사용 가능</span>
            </a>

            <!-- 물 (수질분석) -->
            <a href="water/index.html" class="sample-type-card water">
                <img class="card-icon" src="assets/icons/water.svg" alt="수질분석">
                <div class="card-title">수질분석</div>
                <div class="card-description">지하수, 지표수 수질 분석</div>
                <span class="card-status active">● 사용 가능</span>
            </a>

            <!-- 잔류농약 -->
            <a href="pesticide/index.html" class="sample-type-card pesticide">
                <img class="card-icon" src="assets/icons/pesticide.svg" alt="잔류농약">
                <div class="card-title">잔류농약</div>
                <div class="card-description">농산물 잔류농약 분석</div>
                <span class="card-status active">● 사용 가능</span>
            </a>

            <!-- 가축분뇨퇴비 -->
            <a href="compost/index.html" class="sample-type-card compost">
                <img class="card-icon" src="assets/icons/compost.svg" alt="가축분뇨퇴비">
                <div class="card-title">가축분뇨퇴비</div>
                <div class="card-description">퇴비, 액비 부숙도 검사</div>
                <span class="card-status active">● 사용 가능</span>
            </a>

            <!-- 중금속 -->
            <a href="heavy-metal/index.html" class="sample-type-card heavy-metal">
                <img class="card-icon" src="assets/icons/heavy-metal.svg" alt="토양 중금속">
                <div class="card-title">토양 중금속</div>
                <div class="card-description">토양 중금속 분석</div>
                <span class="card-status active">● 사용 가능</span>
            </a>

        </div>

        <div class="footer">
            <p id="orgNameDisplay">봉화군농업기술센터 안전성분석센터</p>
            <p class="version-info" id="appVersion">v1.9.0</p>
            <!-- 클라우드 동기화 상태 -->
            <p class="sync-status hidden" id="syncStatus">
                <span class="sync-icon">☁️</span>
                <span class="sync-text">동기화됨</span>
            </p>
        </div>
    </div>

    <script type="module" src="main-entry.ts"></script>
</body>

</html>
