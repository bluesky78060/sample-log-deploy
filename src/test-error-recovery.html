<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에러 복구 가이드 테스트</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 2rem;
            color: var(--gray-800);
        }

        .test-section {
            margin-bottom: 2rem;
        }

        .test-section h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--gray-700);
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .test-btn {
            padding: 0.75rem 1.5rem;
            background: var(--primary-rgb);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .test-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .test-btn:active {
            transform: translateY(0);
        }

        .test-btn.secondary {
            background: var(--gray-600);
        }

        .test-btn.secondary:hover {
            background: var(--gray-700);
        }

        .status {
            margin-top: 1.5rem;
            padding: 1rem;
            background: var(--gray-100);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            color: var(--gray-700);
        }

        .status-item {
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>
    <div id="toastContainer"></div>

    <h1>에러 복구 가이드 테스트</h1>

    <div class="test-section">
        <h2>기본 에러 복구</h2>
        <div class="button-group">
            <button class="test-btn" onclick="testErrorRecovery()">
                에러 발생 (복구 버튼 포함)
            </button>
            <button class="test-btn secondary" onclick="resetAttemptCount()">
                시도 횟수 초기화
            </button>
        </div>
    </div>

    <div class="test-section">
        <h2>시나리오별 테스트</h2>
        <div class="button-group">
            <button class="test-btn" onclick="testNetworkError()">
                네트워크 에러
            </button>
            <button class="test-btn" onclick="testFileError()">
                파일 저장 에러
            </button>
            <button class="test-btn" onclick="testFirebaseError()">
                Firebase 동기화 에러
            </button>
            <button class="test-btn" onclick="testEncryptionError()">
                암호화 에러
            </button>
        </div>
    </div>

    <div class="test-section">
        <h2>고급 테스트</h2>
        <div class="button-group">
            <button class="test-btn" onclick="testMultipleErrors()">
                여러 에러 연속 발생
            </button>
            <button class="test-btn" onclick="testPersistentToast()">
                영구 토스트 (persistent)
            </button>
            <button class="test-btn" onclick="testNoRetryButton()">
                재시도 버튼 없음
            </button>
            <button class="test-btn" onclick="testCustomAction()">
                커스텀 액션
            </button>
        </div>
    </div>

    <div class="test-section">
        <h2>직접 showToast 호출</h2>
        <div class="button-group">
            <button class="test-btn" onclick="testBasicToast()">
                기본 토스트
            </button>
            <button class="test-btn" onclick="testToastWithAction()">
                액션 버튼 있는 토스트
            </button>
        </div>
    </div>

    <div class="status">
        <h3>테스트 상태</h3>
        <div class="status-item">시도 횟수: <strong id="attemptCount">0</strong></div>
        <div class="status-item">마지막 액션: <strong id="lastAction">없음</strong></div>
    </div>

    <script src="shared/constants.js"></script>
    <script src="shared/toast.js"></script>
    <script src="shared/logger.js"></script>
    <script src="shared/error-handler.js"></script>

    <script>
        let attemptCount = 0;

        function updateStatus(action) {
            document.getElementById('attemptCount').textContent = attemptCount;
            document.getElementById('lastAction').textContent = action;
        }

        function resetAttemptCount() {
            attemptCount = 0;
            updateStatus('초기화됨');
            showToast('시도 횟수가 초기화되었습니다.', 'info');
        }

        // 1. 기본 에러 복구 (3번째 시도에서 성공)
        function testErrorRecovery() {
            attemptCount = 0;
            simulateError();
        }

        function simulateError() {
            attemptCount++;
            updateStatus(`에러 발생 (${attemptCount}번째 시도)`);

            if (attemptCount < 3) {
                ErrorHandler.handle(
                    new Error('Simulated error'),
                    'FILE_WRITE',
                    {
                        retry: () => simulateError(),
                        showRetryButton: true
                    }
                );
            } else {
                showToast('성공! 3번째 시도에서 성공했습니다.', 'success');
                updateStatus('성공');
            }
        }

        // 2. 네트워크 에러
        function testNetworkError() {
            updateStatus('네트워크 에러 테스트');
            ErrorHandler.handle(
                new Error('Network timeout'),
                'NETWORK',
                {
                    retry: () => {
                        showToast('네트워크 연결 재시도 중...', 'info');
                        setTimeout(() => {
                            showToast('연결 성공!', 'success');
                            updateStatus('네트워크 연결 성공');
                        }, 1000);
                    },
                    showRetryButton: true
                }
            );
        }

        // 3. 파일 에러
        function testFileError() {
            updateStatus('파일 저장 에러 테스트');
            ErrorHandler.handle(
                new Error('Write failed'),
                'FILE_WRITE',
                {
                    retry: () => {
                        showToast('파일 저장을 다시 시도합니다...', 'info');
                        setTimeout(() => {
                            showToast('파일 저장 성공!', 'success');
                            updateStatus('파일 저장 성공');
                        }, 1000);
                    },
                    showRetryButton: true
                }
            );
        }

        // 4. Firebase 에러
        function testFirebaseError() {
            updateStatus('Firebase 동기화 에러 테스트');
            ErrorHandler.handle(
                new Error('Firestore sync failed'),
                'FIREBASE_SYNC',
                {
                    retry: () => {
                        showToast('클라우드 동기화 재시도 중...', 'info');
                        setTimeout(() => {
                            showToast('동기화 성공!', 'success');
                            updateStatus('동기화 성공');
                        }, 1000);
                    },
                    showRetryButton: true
                }
            );
        }

        // 5. 암호화 에러
        function testEncryptionError() {
            updateStatus('암호화 에러 테스트');
            ErrorHandler.handle(
                new Error('Encryption failed'),
                'ENCRYPTION',
                {
                    retry: () => {
                        showToast('암호화 재시도 중...', 'info');
                        setTimeout(() => {
                            showToast('암호화 성공!', 'success');
                            updateStatus('암호화 성공');
                        }, 1000);
                    },
                    showRetryButton: true
                }
            );
        }

        // 6. 여러 에러 연속 발생
        function testMultipleErrors() {
            updateStatus('여러 에러 연속 발생');
            const errors = [
                { context: 'NETWORK', message: 'Network error' },
                { context: 'FILE_WRITE', message: 'Write error' },
                { context: 'FIREBASE_SYNC', message: 'Sync error' }
            ];

            errors.forEach((err, index) => {
                setTimeout(() => {
                    ErrorHandler.handle(
                        new Error(err.message),
                        err.context,
                        {
                            retry: () => showToast(`${err.context} 재시도 성공`, 'success'),
                            showRetryButton: true
                        }
                    );
                }, index * 600);  // 0.6초 간격
            });
        }

        // 7. 영구 토스트 (persistent)
        function testPersistentToast() {
            updateStatus('영구 토스트 테스트');
            showToast('이 토스트는 자동으로 사라지지 않습니다. 닫기 버튼을 눌러주세요.', 'warning', {
                persistent: true,
                actionLabel: '확인',
                action: () => {
                    showToast('확인 버튼을 클릭했습니다!', 'success');
                    updateStatus('확인 버튼 클릭');
                }
            });
        }

        // 8. 재시도 버튼 없음
        function testNoRetryButton() {
            updateStatus('재시도 버튼 없는 에러');
            ErrorHandler.handle(
                new Error('Error without retry button'),
                'VALIDATION',
                {
                    retry: null,
                    showRetryButton: false
                }
            );
        }

        // 9. 커스텀 액션
        function testCustomAction() {
            updateStatus('커스텀 액션 테스트');
            showToast('커스텀 액션이 있는 토스트입니다.', 'info', {
                duration: 5000,
                actionLabel: '자세히 보기',
                action: () => {
                    alert('자세한 내용을 표시합니다.');
                    updateStatus('자세히 보기 클릭');
                }
            });
        }

        // 10. 기본 토스트
        function testBasicToast() {
            updateStatus('기본 토스트');
            showToast('기본 토스트 메시지입니다.', 'success');
        }

        // 11. 액션 버튼 있는 토스트
        function testToastWithAction() {
            updateStatus('액션 버튼 토스트');
            showToast('이 토스트에는 액션 버튼이 있습니다.', 'error', {
                actionLabel: '다시 시도',
                action: () => {
                    showToast('재시도 버튼을 클릭했습니다!', 'success');
                    updateStatus('재시도 클릭');
                }
            });
        }

        // 초기 상태 업데이트
        updateStatus('준비됨');
    </script>
</body>
</html>
