<!DOCTYPE html>
<html lang="ko" data-theme="light" data-sample-type="compost-analysis">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퇴·액비 분석결과 조회</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
    <link rel="stylesheet" href="../shared/tailwind-output.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="compost-analysis-style.css">
</head>

<body class="ca-analysis-page">
    <!-- 네비게이션 바 -->
    <nav class="navbar ca-analysis-navbar">
        <!-- 뒤로가기 버튼 -->
        <button type="button" class="back-btn" id="backBtn" title="이전 페이지로"><span class="material-icons-outlined">arrow_back</span></button>
        <!-- 로고 -->
        <div class="navbar-brand">
            <span class="brand-icon">🧫</span>
            <span class="brand-text">퇴·액비 분석결과 조회</span>
        </div>

        <div class="navbar-divider"></div>

        <!-- 툴바 -->
        <div class="navbar-actions ca-analysis-toolbar">
            <select id="yearSelect" class="toolbar-select" style="display:none;"></select>
            <div class="toolbar-field">
                <label for="bulkTestDate">검사일자</label>
                <div style="display: flex; gap: 4px; align-items: center;">
                    <input type="date" id="bulkTestDate" class="toolbar-input">
                    <button type="button" id="clearTestDateBtn" class="toolbar-btn-small" title="검사일자 일괄 삭제" aria-label="검사일자 일괄 삭제">✕</button>
                </div>
            </div>
            <div class="toolbar-field">
                <label for="bulkResult">판정 일괄</label>
                <select id="bulkResult" class="toolbar-select">
                    <option value="">선택</option>
                    <option value="pass">적합</option>
                    <option value="fail">부적합</option>
                </select>
            </div>
        </div>

        <div class="navbar-spacer"></div>

        <!-- 유틸리티 -->
        <div class="navbar-utils">
            <button type="button" id="selectAllBtn" class="util-btn" title="전체 선택/해제">
                <span class="material-icons-outlined">select_all</span>
                <span class="util-btn-label">전체선택</span>
            </button>
            <button type="button" id="applyBulkBtn" class="util-btn" title="일괄 적용">
                <span class="material-icons-outlined">playlist_add_check</span>
                <span class="util-btn-label">일괄적용</span>
            </button>
            <button type="button" id="exportBtn" class="util-btn export-btn" title="퇴·액비 분석결과 내보내기">
                <span class="material-icons-outlined">download</span>
                <span class="util-btn-label">내보내기</span>
            </button>
        </div>

        <div class="navbar-divider"></div>

        <!-- 다크 모드 토글 -->
        <div class="theme-toggle" id="themeToggleContainer">
            <span class="theme-icon sun"><span class="material-icons-outlined">light_mode</span></span>
            <button class="theme-toggle-btn" id="themeToggleBtn" title="다크 모드 전환"></button>
            <span class="theme-icon moon"><span class="material-icons-outlined">dark_mode</span></span>
        </div>
    </nav>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <div class="ca-analysis-info-bar">
            <span class="info-text">
                <span class="material-icons-outlined" style="font-size: 16px; vertical-align: middle;">info</span>
                퇴·액비 접수 데이터를 기반으로 분석 결과를 입력합니다. 가축분퇴비·액비 공정규격.
            </span>
            <span class="record-count" id="recordCount">0건</span>
        </div>

        <div class="table-wrapper" id="tableWrapper">
            <table class="ca-analysis-table" id="caAnalysisTable">
                <thead>
                    <tr class="header-group">
                        <th colspan="6" class="header-group-label group-info">접수 정보</th>
                        <th colspan="1" class="header-group-label group-common">공통</th>
                        <th colspan="5" class="header-group-label group-fields">분석 항목</th>
                        <th colspan="1" class="header-group-label group-result">판정</th>
                    </tr>
                    <tr>
                        <th class="col-checkbox sticky-col"><input type="checkbox" id="selectAll" title="전체 선택"></th>
                        <th class="col-num sticky-col">접수번호</th>
                        <th class="col-name sticky-col">성명</th>
                        <th class="col-animaltype sticky-col">축종</th>
                        <th class="col-sampletype sticky-col">시료종류</th>
                        <th class="col-date sticky-col">접수일자</th>
                        <!-- 공통: 검사일자 -->
                        <th class="col-testdate">검사일자</th>
                        <!-- 분석 항목 -->
                        <th class="col-field">함수율(%)</th>
                        <th class="col-field">부숙도</th>
                        <th class="col-field">염분(%)</th>
                        <th class="col-field">구리(Cu)<br><small>mg/kg</small></th>
                        <th class="col-field">아연(Zn)<br><small>mg/kg</small></th>
                        <!-- 판정 -->
                        <th class="col-judgment">판정</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>

            <div id="emptyState" class="empty-state">
                <div class="empty-icon">📭</div>
                <p>퇴·액비 접수 데이터가 없습니다</p>
                <p class="empty-sub">먼저 퇴·액비 시료 접수 페이지에서 데이터를 등록하세요.</p>
            </div>
        </div>
    </main>

    <!-- 토스트 메시지 -->
    <div id="toastContainer" class="toast-container"></div>

    <script type="module" src="compost-analysis-entry.ts"></script>
</body>

</html>
