name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (informational)
        run: npm run typecheck
        continue-on-error: true

      # SAMPL-2-18: 타입에러 회귀 방지 래칫 (하드 게이트).
      # 기존 타입에러 baseline(scripts/typecheck-baseline.txt)을 초과하면 실패.
      # build/make는 건드리지 않으므로 로컬 릴리스 빌드에는 영향 없음.
      - name: Type check regression gate
        run: npm run typecheck:gate

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm run test:unit
        continue-on-error: true

  build-test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run build || echo "Build script not found, skipping"
