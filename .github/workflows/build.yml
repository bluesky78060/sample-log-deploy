name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create network-config with secrets
        run: |
          @"
          (window as any).NETWORK_CONFIG = {
              ALLOWED_GATEWAY: '${{ secrets.ALLOWED_GATEWAY }}'
          };
          "@ | Out-File -FilePath "src/shared/network-config.ts" -Encoding utf8
        shell: pwsh

      # SAMPL-2-19: VWORLD 키는 렌더러(network-config)가 아닌 메인 프로세스로 주입.
      # build:electron 의 gen-vworld-key.mjs 가 이 env 를 읽어 dist/vworld-key.txt 생성.
      - name: Build Windows package
        run: npm run make
        env:
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          JUSO_API_KEY: ${{ secrets.JUSO_API_KEY }}
          FOODSAFETY_API_KEY: ${{ secrets.FOODSAFETY_API_KEY }}
          RAD_PSIS_API_KEY: ${{ secrets.RAD_PSIS_API_KEY }}

      - name: Create latest.yml for auto-updater
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $exeFile = Get-ChildItem -Path "out/make/squirrel.windows/x64" -Filter "*Setup.exe" | Select-Object -First 1
          $exeSize = $exeFile.Length
          $exeHash = (Get-FileHash -Path $exeFile.FullName -Algorithm SHA512).Hash.ToLower()
          $content = @"
          version: $version
          files:
            - url: $($exeFile.Name)
              sha512: $exeHash
              size: $exeSize
          path: $($exeFile.Name)
          sha512: $exeHash
          releaseDate: $(Get-Date -Format "yyyy-MM-ddTHH:mm:ss.fffZ")
          "@
          $content | Out-File -FilePath "out/make/squirrel.windows/x64/latest.yml" -Encoding utf8
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/make/**/*

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
            out/make/squirrel.windows/x64/latest.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create network-config with secrets
        run: |
          cat > src/shared/network-config.ts << 'NETEOF'
          (window as any).NETWORK_CONFIG = {
              ALLOWED_GATEWAY: '${{ secrets.ALLOWED_GATEWAY }}'
          };
          NETEOF

      # SAMPL-2-19: VWORLD 키는 렌더러(network-config)가 아닌 메인 프로세스로 주입.
      - name: Build macOS package
        run: npm run make -- --platform darwin
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          JUSO_API_KEY: ${{ secrets.JUSO_API_KEY }}
          FOODSAFETY_API_KEY: ${{ secrets.FOODSAFETY_API_KEY }}
          RAD_PSIS_API_KEY: ${{ secrets.RAD_PSIS_API_KEY }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: out/make/**/*

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: out/make/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
